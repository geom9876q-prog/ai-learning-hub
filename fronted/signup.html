<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - AI Learning Hub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            AI Learning Hub
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="login.html">Login</a>
            <a href="signup.html" class="signup-btn active">Sign Up</a>
        </div>

    </nav>


    <main class="auth-page">

        <div class="auth-card">

            <p class="section-tag">GET STARTED</p>

            <h1>Create your account</h1>

            <p class="auth-description">
                Start your personalized learning journey.
            </p>


            <form id="signupForm">

                <div class="form-group">

                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button type="submit" class="auth-btn">
                    Create Account
                </button>

            </form>


            <p id="signupMessage" class="form-message"></p>


            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </main>


    <footer>

        <div class="footer-logo">
            AI Learning Hub
        </div>

        <p>
            Personalized learning powered by your progress.
        </p>

    </footer>


    <script src="js/auth.js"></script>

</body>

</html>
