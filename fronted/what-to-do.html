<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>What To Do - AI Learning Hub</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            AI Learning Hub
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="courses.html">
                Courses
            </a>

            <a href="about.html">
                About
            </a>

            <button
                id="logoutBtn"
                class="logout-btn">

                Logout

            </button>

        </div>

    </nav>


    <!-- WHAT TO DO -->

    <main class="dashboard">

        <section class="dashboard-header">

            <p class="section-tag">
                PERSONALIZED LEARNING
            </p>

            <h1>
                What do you want to achieve?
            </h1>

            <p>
                Tell us about your goal and available
                time. We'll create a learning plan for you.
            </p>

        </section>


        <section class="dashboard-section">

            <div class="dashboard-card">

                <form id="learnerProfileForm">


                    <!-- CAREER GOAL -->

                    <div class="form-group">

                        <label for="careerGoal">
                            What do you want to become?
                        </label>

                        <input
                            type="text"
                            id="careerGoal"
                            placeholder="Example: Backend Developer"
                            required>

                    </div>


                    <!-- MOTIVATION -->

                    <div class="form-group">

                        <label for="motivation">
                            Why are you learning?
                        </label>

                        <textarea
                            id="motivation"
                            placeholder="Example: I want to get an internship"
                            rows="4">
                        </textarea>

                    </div>


                    <!-- CURRENT LEVEL -->

                    <div class="form-group">

                        <label for="currentLevel">
                            What is your current level?
                        </label>

                        <select id="currentLevel">

                            <option value="Beginner">
                                Beginner
                            </option>

                            <option value="Intermediate">
                                Intermediate
                            </option>

                            <option value="Advanced">
                                Advanced
                            </option>

                        </select>

                    </div>


                    <!-- DAYS TO GOAL -->

                    <div class="form-group">

                        <label for="daysToGoal">
                            How many days do you have?
                        </label>

                        <input
                            type="number"
                            id="daysToGoal"
                            min="1"
                            placeholder="Example: 120"
                            required>

                    </div>


                    <!-- DAILY STUDY TIME -->

                    <div class="form-group">

                        <label for="dailyStudyMinutes">
                            How many minutes can you study daily?
                        </label>

                        <input
                            type="number"
                            id="dailyStudyMinutes"
                            min="1"
                            placeholder="Example: 120"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="auth-btn">

                        Generate My Learning Plan

                    </button>


                    <p
                        id="profileMessage"
                        class="form-message">
                    </p>

                </form>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 AI Learning Hub.
            Learn smarter. Recover faster.
        </p>

    </footer>


    <script src="js/what-to-do.js"></script>

</body>

</html>
