<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz - AI Learning Hub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        AI Learning Hub
    </div>

    <div class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="about.html">
            About
        </a>

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>

    </div>

</nav>


<main class="dashboard">

    <section class="dashboard-header">

        <p class="section-tag">
            QUIZ
        </p>

        <h1 id="quizTitle">
            Loading Quiz...
        </h1>

        <p id="quizDescription">
            Test your understanding of this lesson.
        </p>

    </section>


    <section class="dashboard-section">

        <div id="quizContainer">

            <p>
                Loading questions...
            </p>

        </div>

    </section>


    <section class="dashboard-section">

        <button
            id="submitQuizBtn"
            class="auth-btn">

            Submit Quiz

        </button>

        <p
            id="quizMessage"
            class="form-message">
        </p>

    </section>

</main>


<footer>

    <p>
        © 2026 AI Learning Hub.
        Learn smarter. Recover faster.
    </p>

</footer>


<script src="js/quiz.js"></script>

</body>

</html>
